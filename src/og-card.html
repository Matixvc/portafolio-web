<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OG Card - Matias Villalobos</title>
    <!--
        Plantilla usada SOLO en build time para generar assets/og-image.png (1200x630).
        Se renderiza con Edge headless:  npm run og
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1200px; height: 630px; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: #08090a;
            color: #f3f4f6;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 72px;
        }
        .grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 26px 26px;
        }
        .glow-a {
            position: absolute;
            top: -160px;
            right: -120px;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.28) 0%, rgba(0, 242, 254, 0) 68%);
        }
        .glow-b {
            position: absolute;
            bottom: -220px;
            left: -140px;
            width: 640px;
            height: 640px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.30) 0%, rgba(121, 40, 202, 0) 68%);
        }
        .card {
            position: relative;
            width: 100%;
            background: rgba(18, 19, 22, 0.72);
            border: 1px solid #22242a;
            border-radius: 28px;
            padding: 52px 60px;
            box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.9);
        }
        .top {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 30px;
        }
        .logo {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            background: linear-gradient(135deg, #00f2fe 0%, #0070f3 50%, #7928ca 100%);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo span {
            width: 100%;
            height: 100%;
            border-radius: 19px;
            background: #08090a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #00f2fe;
        }
        .kicker {
            font-size: 20px;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        h1 {
            font-size: 62px;
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 14px;
        }
        .grad {
            background: linear-gradient(135deg, #00f2fe 0%, #0070f3 50%, #7928ca 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .role {
            font-size: 27px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 30px;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 12px; }
        .chip {
            font-size: 19px;
            font-weight: 600;
            color: #d1d5db;
            background: #121316;
            border: 1px solid #2b2e35;
            border-radius: 999px;
            padding: 9px 20px;
        }
        .chip.cyan { color: #00f2fe; border-color: rgba(0, 242, 254, 0.35); }
        .chip.violet { color: #a78bfa; border-color: rgba(121, 40, 202, 0.45); }
        .footer {
            position: absolute;
            left: 72px;
            right: 72px;
            bottom: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: #6b7280;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <div class="card">
        <div class="top">
            <div class="logo"><span>MV</span></div>
            <div class="kicker">Portafolio profesional</div>
        </div>

        <h1>Mat&iacute;as I. Villalobos Cautivo</h1>
        <div class="role"><span class="grad">Unity &amp; XR Developer</span> &middot; C# / Simulaciones 3D</div>

        <div class="chips">
            <span class="chip cyan">Unity + C#</span>
            <span class="chip violet">XR / VR / AR</span>
            <span class="chip">Gameplay &amp; Sistemas</span>
            <span class="chip">Blender</span>
        </div>
    </div>

    <div class="footer">
        <span>Santiago, Chile &middot; Remoto / H&iacute;brido</span>
        <span>Disponible para pr&aacute;ctica profesional part-time</span>
    </div>
</body>
</html>
